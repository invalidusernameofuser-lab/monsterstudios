<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    
    <!-- Method 1: Instant Meta Redirect (0 seconds delay) -->
    <meta http-equiv="refresh" content="0; url=https://aorue.is-local.host">
</head>
<body>

    <!-- Method 2: JavaScript Backup (Agar browser refresh ko block kare to) -->
    <script>
        window.location.href = "https://aorue.is-local.host";
    </script>

    <!-- Agar dono kaam na karein to user click kar sake -->
    <p>Agar aap redirect nahi hue, to <a href="https://aorue.is-local.host">yahan click karein</a>.</p>
</body>
</html>
